  <text x="96" y="675" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#475569"><tspan x="96" dy="0">Texto explicativo com termos</tspan><tspan x="96" dy="16">técnicos e pontuação refinada</tspan><tspan x="96" dy="16">para locução de vídeo pericial.</tspan></text>
  
