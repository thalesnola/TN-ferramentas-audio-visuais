# Exemplo; ajustar caminhos e mesclar com a configuração existente.

[mcp_servers.artcraft_photocraft]
command = "C:/Tools/audio-visual/ArtCraft/photocraft-0.8.2-windows-x64-portable/photocraft-cli.exe"
args = ["mcp", "--automation-read-root", "C:/Tools/audio-visual/trabalho", "--automation-write-root", "C:/Tools/audio-visual/trabalho/saida"]
enabled = true
startup_timeout_sec = 30

